name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for every job; the container job adds packages: write for itself.
permissions:
  contents: read

jobs:
  server:
    name: server (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # rustup reads rust-toolchain.toml (channel + clippy, rustfmt)
      # and installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: server-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'project-blue/CMakeLists.txt', 'project-blue/cmake/**', 'project-blue/src/**') }}
          restore-keys: |
            server-${{ runner.os }}-

      # The game repository's C++ codec tests read a copy of the golden vectors.
      - name: Golden vectors match the game repository
        run: diff -r crates/blue-protocol/tests/vectors project-blue/docs/netcode/vectors

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Builds the server and bot images, smoke-tests them and, on main, pushes
  # the server image that passed (the same image, not a rebuild).
  container:
    name: container (image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Only used by the push step, which never runs for pull requests.
      packages: write
    # One run at a time on main so two pushes cannot race on the `latest`
    # tag; a run that is already pushing is never cancelled (a newer queued
    # run replaces an older queued one). Other refs do not wait.
    concurrency:
      group: container-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # assets/ is gitignored and the server image copies it, so cook it
      # first. The cook (336 compile steps) depends only on the submodule
      # commit and the two files that drive it, so cache it on those.
      - name: Submodule commit
        id: blue
        run: echo "sha=$(git rev-parse HEAD:project-blue)" >> "$GITHUB_OUTPUT"

      - name: Cache cooked assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: assets-${{ runner.os }}-${{ steps.blue.outputs.sha }}-${{ hashFiles('docker/assets.Dockerfile', 'scripts/cook-assets.sh') }}

      # Runs before setup-buildx on purpose: cook-assets.sh calls plain
      # `docker build --output type=local`, which the default builder handles.
      - name: Cook assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: scripts/cook-assets.sh

      - name: Assets present
        run: test -n "$(ls -A assets)" && find assets -type f | wc -l

      - uses: docker/setup-buildx-action@v3

      # `load: true` puts each image into the local daemon, where
      # scripts/smoke-test.sh looks for blue-server and blue-bot. `context: .`
      # is required: the action's default is the git URL, which has neither
      # the submodule nor assets/. Layers are cached in the GitHub cache.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: blue-server
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bot
          load: true
          provenance: false
          tags: blue-bot
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max

      - name: Smoke test (stand-in simulation)
        run: scripts/smoke-test.sh standin

      - name: Smoke test (native simulation)
        run: scripts/smoke-test.sh native

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the local image the smoke test ran, under two tags.
      - name: Push server image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag blue-server "${image}:${tag}"
            docker push "${image}:${tag}"
          done
